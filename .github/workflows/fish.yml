name: Fish-Contribution-Pond

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fish.mjs]

permissions:
  contents: write

jobs:
  fish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw the pond
        run: node scripts/fish.mjs assets/fish-contribution.svg
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the new pond
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fish-contribution.svg
          if git diff --staged --quiet; then
            echo "Pond unchanged."
          else
            git commit -m "chore: update contribution pond"
            git pull --rebase
            git push
          fi
